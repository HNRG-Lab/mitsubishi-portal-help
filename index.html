<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guida al portale e-commerce B2B</title>
<meta name="description" content="Video tutorial e istruzioni passo-passo per l'uso del portale e-commerce B2B.">
<style>
/* Stile ispirato al portale (SAP Composable Storefront): Roboto, bianco/nero, accento rosso.
   Nessun font remoto: si usa Roboto se installato, altrimenti font di sistema (no chiamate a terze parti). */
:root{
  --red:#db0002; --red-dark:#b00002; --black:#000; --text:#3c3c3c; --muted:#6c7079;
  --bg:#f6f6f6; --light:#f1f1f1; --line:#e0e0e0; --white:#fff; --info:#17a2b8; --warn:#ffc107; --ok:#38871f;
  --header-h:72px; --radius:2px;
  --font: Roboto, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--font);font-weight:300;color:var(--text);background:var(--white);font-size:17px;line-height:1.55}
a{color:var(--black)}
h1,h2,h3{font-weight:500;color:var(--black);line-height:1.2}
button{font-family:inherit}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Header */
.topbar{position:sticky;top:0;z-index:50;background:var(--white);border-bottom:1px solid var(--line);height:var(--header-h)}
.topbar .wrap{max-width:1400px;margin:0 auto;height:100%;display:flex;align-items:center;gap:20px;padding:0 24px}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--black);min-width:0}
.brand img{height:42px;width:auto}
.brand .title{display:flex;flex-direction:column;line-height:1.15;border-left:1px solid var(--line);padding-left:14px}
.brand .title b{font-weight:500;font-size:17px;white-space:nowrap}
.brand .title span{font-size:13px;color:var(--muted);white-space:nowrap}
.search{margin-left:auto;position:relative;flex:0 1 380px}
.search input{width:100%;border:0;border-bottom:1px solid var(--black);padding:10px 36px 8px 2px;font:inherit;font-size:15px;background:transparent;outline:none}
.search input::placeholder{font-style:italic;color:#888}
.search svg{position:absolute;right:4px;top:10px}
.search-results{position:absolute;top:46px;right:0;left:0;background:var(--white);border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.12);max-height:60vh;overflow:auto;display:none}
.search-results.open{display:block}
.search-results a{display:block;padding:10px 14px;text-decoration:none;border-bottom:1px solid var(--light);font-size:15px}
.search-results a:hover,.search-results a:focus{background:var(--bg)}
.search-results small{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.search-results .none{padding:12px 14px;color:var(--muted);font-size:14px}
.menu-btn{display:none;background:var(--black);color:#fff;border:0;width:44px;height:44px;cursor:pointer}

/* Hero + breadcrumb */
.hero{background:linear-gradient(120deg,#000 0%,#1b1b1b 55%,#3a0000 100%);color:#fff;text-align:center;padding:56px 24px 48px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 1px,transparent 1px 80px)}
.hero h1{color:#fff;font-size:clamp(28px,4vw,44px);margin:0 0 10px;position:relative;z-index:1}
.hero p{margin:0 auto;max-width:720px;font-size:18px;opacity:.88;position:relative;z-index:1}
.crumbs{background:var(--black);color:#fff;font-size:15px}
.crumbs .wrap{max-width:1400px;margin:0 auto;padding:12px 24px}
.crumbs a{color:#fff;text-decoration:none}
.crumbs a:hover{text-decoration:underline}
.crumbs span.sep{margin:0 8px;opacity:.6}

/* Layout */
.layout{max-width:1400px;margin:0 auto;display:grid;grid-template-columns:300px 1fr;gap:0;align-items:start}
nav.side{position:sticky;top:var(--header-h);max-height:calc(100vh - var(--header-h));overflow:auto;background:var(--bg);border-right:1px solid var(--line);padding:18px 0 40px}
nav.side .ch{margin:0 0 6px}
nav.side .ch-title{display:flex;align-items:center;gap:10px;padding:10px 22px;font-weight:500;color:var(--black);font-size:15px;text-transform:uppercase;letter-spacing:.03em}
nav.side .ch-title .n{display:inline-grid;place-items:center;width:24px;height:24px;background:var(--black);color:#fff;font-size:12px;border-radius:50%}
nav.side ul{list-style:none;margin:0;padding:0}
nav.side li a{display:block;padding:7px 22px 7px 56px;text-decoration:none;font-size:15px;color:var(--text);border-left:3px solid transparent}
nav.side li a:hover{background:var(--light);color:var(--black)}
nav.side li a.active{border-left-color:var(--red);color:var(--red);font-weight:500;background:var(--white)}
nav.side li a{display:flex!important;justify-content:space-between;gap:8px}
nav.side li a .vid{font-size:10px;color:var(--muted);margin-top:5px;flex:none}
main{padding:32px 40px 64px;min-width:0}

/* Home */
.intro{max-width:900px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;margin-top:28px}
.card{background:var(--bg);padding:22px 22px 18px;text-decoration:none;color:var(--text);display:flex;flex-direction:column;gap:8px;border-bottom:3px solid transparent;transition:border-color .15s, background .15s}
.card:hover{border-bottom-color:var(--red);background:var(--light)}
.card h3{margin:0;font-size:19px;display:flex;gap:10px;align-items:center}
.card h3 .n{display:inline-grid;place-items:center;width:28px;height:28px;background:var(--black);color:#fff;font-size:13px;border-radius:50%;flex:none}
.card p{margin:0;font-size:15px}
.card .go{margin-top:auto;font-weight:500;color:var(--red);font-size:14px}
.quick{margin-top:36px;background:var(--black);color:#fff;padding:24px 26px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.quick h3{color:#fff;margin:0 0 4px;font-size:16px}
.quick p{margin:0;font-size:14px;opacity:.85}

/* Topic */
.eyebrow{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--red);font-weight:500;margin:0 0 6px}
.topic h1{font-size:clamp(26px,3vw,34px);margin:0 0 12px}
.lead{font-size:18px;max-width:900px;margin:0 0 24px}
.player{background:#000;margin:0 0 10px;position:relative}
.player video{width:100%;display:block;max-height:calc(100vh - var(--header-h) - 120px);background:#000}
.player-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 20px;font-size:13px;color:var(--muted)}
.player-bar .label{margin-right:auto}
.chip{border:1px solid var(--black);background:var(--white);color:var(--black);padding:5px 10px;font-size:13px;font-weight:500;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--black);color:#fff}
.vtabs{display:flex;gap:0;margin:0 0 0;border-bottom:1px solid var(--line)}
.vtabs button{border:0;background:none;padding:10px 16px;font-size:15px;cursor:pointer;border-bottom:3px solid transparent;color:var(--text)}
.vtabs button[aria-selected="true"]{border-bottom-color:var(--red);color:var(--black);font-weight:500}
.novideo{background:var(--bg);border:1px dashed #bbb;padding:36px;text-align:center;color:var(--muted);margin:0 0 28px}

/* Video affiancato ai passaggi */
.study{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(340px,1fr);gap:28px;align-items:start}
.study .media{position:sticky;top:calc(var(--header-h) + 14px)}
.study.wide,.study.novid{grid-template-columns:1fr}
.study.wide .media{position:static}
.study .text{min-width:0}
.study .text>.callout{margin-top:16px}
.player-bar .rates{display:inline-flex;gap:6px}
ol.steps>li.linked{cursor:pointer;border-radius:2px;transition:background .15s}
ol.steps>li.linked:hover{background:rgba(0,0,0,.035)}
ol.steps>li.active{background:#fff;box-shadow:inset 3px 0 0 var(--red)}
ol.steps>li.active::before{background:var(--red)}
ol.steps>li{padding-right:6px}
.seek{display:inline-flex;align-items:center;gap:4px;margin:0 8px 4px 0;padding:2px 8px;border:1px solid var(--black);background:var(--black);color:#fff;font:500 12px/1.6 var(--font);cursor:pointer;vertical-align:middle;border-radius:2px;white-space:nowrap}
.seek small{font-size:10px;opacity:.75;font-weight:400}
.seek:hover,.seek:focus-visible{background:var(--red);border-color:var(--red)}
li.active .seek{background:var(--red);border-color:var(--red)}
.seek.demo{cursor:default}
@media (max-width:1200px){.study{grid-template-columns:1fr}.study .media{position:static}#wideBtn{display:none}}
.note-small{font-size:14px;color:var(--muted);margin:4px 0 0}
.panel h3{font-size:17px;margin:18px 0 12px}
.panel{background:var(--bg);padding:22px 24px}
.panel h2{font-size:18px;margin:0 0 12px;text-transform:uppercase;letter-spacing:.03em}
ol.steps{counter-reset:s;list-style:none;margin:0;padding:0}
ol.steps>li{counter-increment:s;position:relative;padding:0 0 16px 46px;margin:0}
ol.steps>li::before{content:counter(s);position:absolute;left:0;top:0;width:30px;height:30px;display:grid;place-items:center;background:var(--black);color:#fff;font-weight:500;font-size:14px;border-radius:50%}
ol.steps>li:not(:last-child)::after{content:"";position:absolute;left:14.5px;top:32px;bottom:2px;width:1px;background:#c9c9c9}
ol.steps ul{margin:6px 0 0;padding-left:18px}
.ui{display:inline-block;font-weight:500;color:var(--black);background:var(--white);border:1px solid var(--black);padding:0 6px;font-size:.88em;white-space:nowrap}
.ui.dark{background:var(--black);color:#fff}
.ui.red{border-color:var(--red);color:var(--red)}
kbd{font-family:Consolas,monospace;background:var(--white);border:1px solid #bbb;border-bottom-width:2px;padding:0 5px;font-size:.9em}
.callout{border-left:4px solid var(--info);background:#eef8fa;padding:14px 16px;margin:0 0 16px;font-size:15px}
.callout b{font-weight:500;color:var(--black)}
.callout.warn{border-left-color:var(--warn);background:#fff8e1}
.callout.important{border-left-color:var(--red);background:#fdeeee}
.callout.tip{border-left-color:var(--ok);background:#eef6eb}
dl.gloss{margin:0}
dl.gloss dt{font-weight:500;color:var(--black);margin-top:12px}
dl.gloss dd{margin:2px 0 0;font-size:15px}
table.fields{border-collapse:collapse;width:100%;font-size:15px;margin:6px 0 18px}
table.fields th{background:var(--black);color:#fff;text-align:left;font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.04em;padding:9px 12px}
table.fields td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top;background:var(--white)}
table.fields td:first-child{font-weight:500;color:var(--black);white-space:nowrap}
.pager{display:flex;justify-content:space-between;gap:16px;margin-top:40px;border-top:1px solid var(--line);padding-top:22px}
.btn{display:inline-flex;align-items:center;gap:10px;padding:11px 18px;font-weight:500;font-size:15px;text-decoration:none;border:1px solid var(--black);color:var(--black);background:var(--white);max-width:48%}
.btn:hover{background:var(--black);color:#fff}
.btn.primary{background:var(--black);color:#fff}
.btn.primary:hover{background:var(--red);border-color:var(--red)}
.btn small{display:block;font-weight:300;font-size:12px;opacity:.75}
.related{margin-top:22px;font-size:15px}
.related a{color:var(--red)}

/* Footer */
footer{background:var(--bg);border-top:1px solid var(--line);text-align:center;padding:22px;font-size:14px;color:var(--muted)}
.totop{position:fixed;right:24px;bottom:24px;width:44px;height:44px;background:var(--black);color:#fff;border:0;cursor:pointer;display:none;z-index:40}
.totop.show{display:grid;place-items:center}

@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  nav.side{position:fixed;top:var(--header-h);left:0;bottom:0;width:300px;max-height:none;transform:translateX(-100%);transition:transform .2s;z-index:45;box-shadow:4px 0 20px rgba(0,0,0,.15)}
  nav.side.open{transform:none}
  .menu-btn{display:grid;place-items:center}
  main{padding:24px 18px 48px}
  .brand .title span{display:none}
  .search{flex:1 1 auto}
  .btn{max-width:100%}
}
@media (max-width:600px){.brand{display:none}.topbar .wrap{gap:12px;padding:0 14px}}
@media print{
  .topbar,nav.side,.player,.player-bar,.vtabs,.pager,.totop,.hero,.crumbs{display:none!important}
  .layout{display:block}
  main{padding:0}
  .study{grid-template-columns:1fr}
  .seek{display:none}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <button class="menu-btn" id="menuBtn" aria-label="Apri indice" aria-expanded="false" aria-controls="side">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 5h16M2 10h16M2 15h16"/></svg>
    </button>
    <a class="brand" href="#/">
      <!-- Inserire il logo ufficiale in img/logo.svg (se assente l'immagine viene nascosta) -->
      <img src="img/logo.svg" alt="Logo" onerror="this.remove()">
      <span class="title"><b>Guida al portale e-commerce</b><span>Video tutorial e istruzioni passo-passo</span></span>
    </a>
    <div class="search" role="search">
      <label for="q" class="sr-only">Cerca nella guida</label>
      <input id="q" type="search" placeholder="Cerca nella guida, es. carrello, fatture…" autocomplete="off" aria-controls="sr">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2"><circle cx="10.5" cy="10.5" r="7"/><path d="m16 16 6 6"/></svg>
      <div class="search-results" id="sr" role="listbox"></div>
    </div>
  </div>
</header>

<div id="top-banner"></div>

<div class="layout">
  <nav class="side" id="side" aria-label="Indice della guida"></nav>
  <main id="main" tabindex="-1"></main>
</div>

<footer>
  Guida all'uso del portale e-commerce B2B · I contenuti mostrati nei video provengono da un ambiente di test e sono a solo scopo illustrativo.
</footer>
<button class="totop" id="totop" aria-label="Torna su">
  <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10l5-5 5 5"/></svg>
</button>

<script>
/* ================== CONFIGURAZIONE ==================
   PORTAL_URL: indirizzo del portale mostrato ai clienti.
   ATTENZIONE: impostare l'indirizzo di PRODUZIONE prima della pubblicazione. */
const PORTAL_URL = "https://it-s1.mitsubishielectric.eu/AC_DX/it/EUR/";

/* ================== CONTENUTI ==================
   Ogni argomento: id, title, summary, videos [{src,label}], body (HTML), aside (HTML opzionale), tags.
   Passaggi: steps([[secondi, "testo"], [secondi, "testo", indiceVideo], [null, "testo senza video"]])
   Il numero di secondi collega il passaggio al momento del video in cui viene mostrato. */
const ui = (t,c='') => `<span class="ui ${c}">${t}</span>`;
const steps = (arr) => `<ol class="steps">${arr.map(([t,h,v])=>`<li${t!=null?` data-t="${t}" data-v="${v||0}"`:''}>${h}</li>`).join('')}</ol>`;

const CHAPTERS = [
{ id:"primi-passi", title:"Primi passi", desc:"Raggiungere il portale, orientarsi nella home page, scegliere la lingua e accedere con le proprie credenziali.",
  topics:[
  { id:"indirizzo", title:"Raggiungere il portale", summary:"Apri il portale dal browser e salvalo tra i preferiti.",
    videos:[],
    body: steps([
      [null,`Apri il browser del tuo computer (si consiglia una versione aggiornata).`],
      [null,`Digita nella barra degli indirizzi:<br><a href="${PORTAL_URL}" target="_blank" rel="noopener"><b>${PORTAL_URL}</b></a>`],
      [null,`Premi <kbd>Invio</kbd>: si apre la home page del portale.`],
      [null,`Salva la pagina tra i preferiti (<kbd>Ctrl</kbd>+<kbd>D</kbd>) per ritrovarla velocemente.`],
    ]),
    tags:"url indirizzo link browser preferiti" },

  { id:"home", title:"La home page", summary:"Come è organizzata la pagina iniziale prima dell'accesso: header, area contenuti e footer.",
    videos:[{src:"login",label:"Home page"}],
    body: steps([
      [0,`<b>Header bar</b> (in alto): il logo, che riporta sempre alla home, il paese, l'icona utente 👤 per accedere e il globo 🌐 per la lingua. Prima dell'accesso il menu prodotti, il carrello e la ricerca non sono ancora visibili.`],
      [1,`<b>Content area</b>: il banner principale con il pulsante ${ui('Go Shopping','red')} e il messaggio di benvenuto del portale.`],
      [2,`<b>Footer</b> (in fondo): il collegamento <i>Visita il sito locale più vicino a te</i> e i link di servizio (note legali, cookie, privacy).`],
    ]),
    aside:`<div class="callout">Prezzi, disponibilità e funzioni d'acquisto sono visibili solo <b>dopo l'accesso</b>.</div>`,
    tags:"home pagina iniziale header footer anonimo banner" },

  { id:"lingua", title:"Cambiare la lingua", summary:"Seleziona la lingua di visualizzazione del portale.",
    videos:[{src:"login",label:"Cambio lingua"}],
    body: steps([
      [3,`Nella barra superiore clicca sull'icona del globo 🌐.`],
      [5,`Si apre il pannello <b>Clicca qui per cambiare la lingua</b>: scegli la lingua desiderata dall'elenco.`],
      [8,`Il portale viene mostrato nella lingua selezionata. Per chiudere il pannello senza cambiare lingua usa la ✕.`],
    ]),
    tags:"lingua language italiano inglese globo traduzione" },

  { id:"accesso", title:"Accedi e recupero password", summary:"Entra nel portale con le tue credenziali o recupera la password.",
    videos:[{src:"login",label:"Accesso"}],
    body: steps([
      [12,`Clicca sull'icona utente 👤 in alto a destra.`],
      [14,`Nel pannello <b>Il mio account</b> clicca su ${ui('Accedi / Registrati','red')}.`],
      [17,`Nella sezione <b>Cliente registrato</b> inserisci il tuo <b>indirizzo e-mail</b> e la <b>password</b>.`],
      [22,`Clicca ${ui('Accedi','dark')}.`],
      [27,`Ad accesso avvenuto la barra superiore mostra le categorie prodotto, il carrello e la ricerca.`],
    ]) + `<h3>Password dimenticata</h3>` + steps([
      [21,`Sotto il campo password trovi i link <b>Hai dimenticato la password?</b> e <b>Richiedi password monouso</b>.`],
      [null,`Con <i>Hai dimenticato la password?</i> inserisci la tua e-mail: riceverai le istruzioni per impostarne una nuova.`],
      [null,`Con <i>Richiedi password monouso</i> ricevi una password valida per un singolo accesso.`],
    ]),
    aside:`<div class="callout warn"><b>Sicurezza.</b> Non condividere le credenziali con altri colleghi: ogni utente deve avere un proprio accesso. Gli ordini registrano chi li ha inseriti.</div>`,
    tags:"login accedi registrati password reset recupero dimenticata monouso credenziali email" },
  ]},

{ id:"navigazione", title:"Navigare nel portale", desc:"Il menu disponibile dopo l'accesso e l'organizzazione delle categorie prodotto.",
  topics:[
  { id:"menu", title:"Il menu da utente autenticato", summary:"Le voci della barra superiore dopo l'accesso.",
    videos:[{src:"menu",label:"Menu"}],
    body: steps([
      [2,`<b>Categorie prodotto</b>: <i>Air conditioning, Jet Towel, Riscaldamento, Sistemi di controllo ed accessori, Ventilazione</i>. Passandoci sopra la voce si evidenzia; cliccando si apre il catalogo.`],
      [7,`<b>Icona utente 👤</b>: apre il menu <b>Il mio account</b> con nome e codice cliente, Rubrica indirizzi, Carrelli salvati, Tracciamento ordini e Disconnetti.`],
      [10,`<b>Icona carrello 🛒</b>: il numero rosso indica quanti articoli ci sono nel carrello.`],
      [13,`<b>Globo 🌐</b>: cambio lingua.`],
      [17,`<b>Lente 🔍</b>: apre il campo di ricerca prodotti.`],
    ]),
    tags:"menu barra navigazione header autenticato" },

  { id:"categorie", title:"Le categorie prodotto", summary:"Come si apre il menu delle categorie e come si arriva alle sottocategorie.",
    videos:[{src:"categories",label:"Categorie"}],
    body: steps([
      [2,`Clicca su una categoria (es. <b>Air conditioning</b>): si apre un pannello con le famiglie, es. <i>Residenziale</i> e <i>Commerciale</i>.`],
      [5,`Scegli una famiglia: a destra compare l'elenco delle sottocategorie.`],
      [12,`Clicca su una sottocategoria: si apre l'elenco prodotti. In alto il percorso (es. <i>Pagina iniziale / Residenziale / …</i>) ti indica dove sei.`],
      [22,`Stesso funzionamento per le altre categorie, es. <b>Jet Towel</b> › <i>Jet Towel SLIM</i> o <i>Jet Towel SMART</i>.`],
      [33,`Con ${ui('Mostra tutti i prodotti →')} vedi l'intera categoria (es. <i>Sistemi di controllo ed accessori</i>).`],
      [37,`Nei risultati puoi restringere l'elenco con i filtri a sinistra (vedi <a href="#/ricerca-categorie">Ricerca per categorie e filtri</a>).`],
    ]),
    tags:"categorie catalogo famiglie sottocategorie air conditioning jet towel riscaldamento ventilazione residenziale commerciale" },
  ]},

{ id:"account", title:"Il mio account", desc:"Dati anagrafici, password, rubrica indirizzi, carrelli salvati, tracciamento di ordini, fatture e consegne.",
  topics:[
  { id:"mio-account", title:"Dettagli account e modifica password", summary:"Consulta i tuoi dati e cambia la password.",
    videos:[{src:"my-account",label:"Il mio account"}],
    body: steps([
      [3,`Clicca sull'icona utente 👤.`],

/* ================== MOTORE ================== */
const FLAT = [];
CHAPTERS.forEach((c,ci)=>c.topics.forEach(t=>{t.ch=c;t.ci=ci;FLAT.push(t);}));
const byId = Object.fromEntries(FLAT.map(t=>[t.id,t]));
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => s.replace(/[&<>"]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const strip = h => h.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const fmt = s => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
let WIDE = false;
try { WIDE = localStorage.getItem('help-wide') === '1'; } catch(e) {}

function renderNav(active){
  $('#side').innerHTML = `<div class="ch"><ul><li><a href="#/" class="${!active?'active':''}" style="padding-left:22px">🏠 Panoramica</a></li></ul></div>` +
  CHAPTERS.map((c,i)=>`
    <div class="ch">
      <div class="ch-title"><span class="n">${i+1}</span>${esc(c.title)}</div>
      <ul>${c.topics.map(t=>`<li><a href="#/${t.id}" class="${active===t.id?'active':''}"><span>${esc(t.title)}</span>${t.videos.length?'<span class="vid">▶</span>':''}</a></li>`).join('')}</ul>
    </div>`).join('');
}

function setBanner(html){ $('#top-banner').innerHTML = html; }

function renderHome(){
  document.title = 'Guida al portale e-commerce B2B';
  setBanner(`<section class="hero"><h1>Guida al portale e-commerce B2B</h1>
    <p>Video brevi e istruzioni passo-passo per cercare i prodotti, gestire il carrello e inviare i tuoi ordini in autonomia.</p></section>`);
  const nVid = new Set(FLAT.flatMap(t=>t.videos.map(v=>v.src))).size;
  $('#main').innerHTML = `
  <div class="intro">
    <p class="eyebrow">Benvenuto</p>
    <h1 style="margin-top:0">Da dove vuoi iniziare?</h1>
    <p class="lead">La guida segue il percorso tipico di un ordine: dall'accesso al portale fino alla conferma. Ogni argomento ha un breve video (${nVid} in totale) affiancato dai passaggi da seguire: clicca <span class="seek demo">▶ 0:12</span> accanto a un passaggio per vedere quel momento nel video.</p>
  </div>
  <div class="cards">
    ${CHAPTERS.map((c,i)=>`<a class="card" href="#/${c.topics[0].id}">
      <h3><span class="n">${i+1}</span>${esc(c.title)}</h3>
      <p>${esc(c.desc)}</p>
      <span class="go">${c.topics.length} argomenti →</span></a>`).join('')}
  </div>
  <div class="quick">
    <div><h3>🔎 Ricerca con asterisco</h3><p>Nel campo di ricerca usa <b>*</b> come jolly, es. PUZ-ZM100* oppure *PUZ*.</p></div>
    <div><h3>📅 Disponibilità</h3><p>La disponibilità è calcolata sul mese in corso; nel carrello vedi la data stimata per ogni riga.</p></div>
    <div><h3>💶 Prezzi</h3><p>In ricerca vedi il prezzo di listino; il tuo prezzo netto compare all'aggiunta al carrello.</p></div>
  </div>`;
}

function videoTag(v){
  return `<video controls preload="metadata" playsinline poster="img/${v.src}.jpg" aria-label="Video: ${esc(v.label)}">
    <source src="video/${v.src}.mp4" type="video/mp4">
    Il tuo browser non supporta la riproduzione video. <a href="video/${v.src}.mp4">Scarica il video</a>.
  </video>`;
}

function renderTopic(t){
  document.title = `${t.title} · Guida al portale`;
  const idx = FLAT.indexOf(t), prev = FLAT[idx-1], next = FLAT[idx+1];
  setBanner(`<div class="crumbs"><div class="wrap"><a href="#/">Guida</a><span class="sep">/</span>${esc(t.ch.title)}<span class="sep">/</span>${esc(t.title)}</div></div>`);
  const hasVideo = t.videos.length > 0;
  const tabs = t.videos.length>1 ? `<div class="vtabs" role="tablist">${t.videos.map((v,i)=>`<button role="tab" aria-selected="${i===0}" data-i="${i}">${i+1}. ${esc(v.label)}</button>`).join('')}</div>` : '';
  const media = hasVideo ? `
    <div class="media">
      ${tabs}
      <div class="player" id="player">${videoTag(t.videos[0])}</div>
      <div class="player-bar">
        <span class="label">Video senza audio · clicca ▶ accanto a un passaggio per vederlo</span>
        <span class="rates">${[0.75,1,1.5].map(r=>`<button class="chip" data-rate="${r}" aria-pressed="${r===1}" title="Velocità di riproduzione">${r}×</button>`).join('')}</span>
        <button class="chip" id="wideBtn" aria-pressed="${WIDE}" title="Mostra il video a tutta larghezza">⤢ Video grande</button>
      </div>
    </div>` : '';
  $('#main').innerHTML = `
  <article class="topic">
    <p class="eyebrow">${t.ci+1}. ${esc(t.ch.title)}</p>
    <h1>${esc(t.title)}</h1>
    <p class="lead">${esc(t.summary)}</p>
    <div class="study ${hasVideo?'':'novid'} ${WIDE?'wide':''}" id="study">
      ${media}
      <div class="text">
        <div class="panel"><h2>Passo per passo</h2>${t.body}</div>
        ${t.aside||''}
        <div class="related"><b>Altri argomenti in questa sezione</b><br>
        ${t.ch.topics.filter(x=>x!==t).map(x=>`<a href="#/${x.id}">${esc(x.title)}</a>`).join('<br>')}</div>
      </div>
    </div>
    <nav class="pager" aria-label="Argomento precedente e successivo">
      ${prev?`<a class="btn" href="#/${prev.id}">← <span><small>Precedente</small>${esc(prev.title)}</span></a>`:'<span></span>'}
      ${next?`<a class="btn primary" href="#/${next.id}"><span><small>Successivo</small>${esc(next.title)}</span> →</a>`:`<a class="btn primary" href="#/">Torna alla panoramica →</a>`}
    </nav>
  </article>`;
  if (!hasVideo) return;

  let cur = 0, rate = 1;
  const multi = t.videos.length > 1;
  const stepEls = $$('#study li[data-t]');
  // pulsante ▶ per ogni passaggio collegato al video
  stepEls.forEach(li=>{
    const s = +li.dataset.t, v = +li.dataset.v;
    const b = document.createElement('button');
    b.className = 'seek'; b.type = 'button';
    b.innerHTML = `▶ ${multi?`<small>video ${v+1}</small> `:''}${fmt(s)}`;
    b.title = 'Guarda questo passaggio nel video';
    b.onclick = (e)=>{ e.stopPropagation(); seek(v, s); };
    li.prepend(b);
    li.classList.add('linked');
    li.onclick = (e)=>{ if(!e.target.closest('a,button')) seek(v, s); };
  });
  const vid = ()=>$('#player video');
  function bind(){
    const v = vid(); v.playbackRate = rate;
    v.addEventListener('timeupdate', highlight);
    v.addEventListener('seeked', highlight);
  }
  function switchVideo(i){
    if (i === cur) return;
    cur = i;
    $('#player').innerHTML = videoTag(t.videos[i]); bind();
    $$('.vtabs button').forEach(x=>x.setAttribute('aria-selected', +x.dataset.i===i));
    highlight();
  }
  function seek(i, s){
    switchVideo(i);
    const v = vid();
    const go = ()=>{ try{ v.currentTime = Math.max(0, s - 0.3); }catch(e){} v.play().catch(()=>{}); };
    if (v.readyState >= 1) go(); else v.addEventListener('loadedmetadata', go, {once:true});
    const r = $('#player').getBoundingClientRect();
    const hh = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--header-h')) || 72;
    if (r.top < hh || r.bottom > innerHeight) $('#player').scrollIntoView({behavior:'smooth', block:'center'});
  }
  function highlight(){
    const v = vid(); const ct = v ? v.currentTime : 0;
    let best = -1;
    stepEls.forEach(li=>{ const s=+li.dataset.t; if (+li.dataset.v===cur && s-0.4<=ct && s>best) best=s; });
    stepEls.forEach(li=>li.classList.toggle('active', +li.dataset.v===cur && +li.dataset.t===best && (ct>0.2 || best>0)));
  }
  bind();
  $$('.chip[data-rate]').forEach(b=>b.onclick=()=>{
    rate = +b.dataset.rate; vid().playbackRate = rate;
    $$('.chip[data-rate]').forEach(x=>x.setAttribute('aria-pressed', x===b));
  });
  $$('.vtabs button').forEach(b=>b.onclick=()=>switchVideo(+b.dataset.i));
  $('#wideBtn').onclick = ()=>{
    WIDE = !WIDE; try{ localStorage.setItem('help-wide', WIDE?'1':'0'); }catch(e){}
    $('#study').classList.toggle('wide', WIDE); $('#wideBtn').setAttribute('aria-pressed', WIDE);
  };
}

function route(){
  const id = location.hash.replace(/^#\/?/,'');
  const t = byId[id];
  $$('video').forEach(v=>v.pause());
  if (t) renderTopic(t); else renderHome();
  renderNav(t && t.id);
  $('#side').classList.remove('open'); $('#menuBtn').setAttribute('aria-expanded','false');
  window.scrollTo(0,0);
  const a = $('#side a.active'); if (a) a.scrollIntoView({block:'nearest'});
}

/* Ricerca */
const INDEX = FLAT.map(t=>({t, hay: norm([t.title,t.summary,t.tags,t.ch.title,strip(t.body),strip(t.aside||'')].join(' '))}));
const q = $('#q'), sr = $('#sr');
q.addEventListener('input', ()=>{
  const terms = norm(q.value.trim()).split(/\s+/).filter(Boolean);
  if (!terms.length){ sr.classList.remove('open'); return; }
  const res = INDEX.map(o=>{
    let score = 0;
    for (const w of terms){ if(!o.hay.includes(w)) return null; if (norm(o.t.title).includes(w)) score+=3; if (norm(o.t.tags).includes(w)) score+=2; score+=1; }
    return {t:o.t, score};
  }).filter(Boolean).sort((a,b)=>b.score-a.score).slice(0,8);
  sr.innerHTML = res.length ? res.map(r=>`<a href="#/${r.t.id}" role="option"><small>${esc(r.t.ch.title)}</small>${esc(r.t.title)}</a>`).join('') : '<div class="none">Nessun risultato. Prova con un altro termine.</div>';
  sr.classList.add('open');
});
q.addEventListener('keydown', e=>{ if(e.key==='Enter'){ const a = sr.querySelector('a'); if(a){ location.hash = a.getAttribute('href'); sr.classList.remove('open'); q.value=''; q.blur(); } } if(e.key==='Escape'){ sr.classList.remove('open'); }});
sr.addEventListener('click', ()=>{ sr.classList.remove('open'); q.value=''; });
document.addEventListener('click', e=>{ if(!e.target.closest('.search')) sr.classList.remove('open'); });

$('#menuBtn').onclick = ()=>{ const o = $('#side').classList.toggle('open'); $('#menuBtn').setAttribute('aria-expanded', o); };
const totop = $('#totop');
window.addEventListener('scroll', ()=>totop.classList.toggle('show', scrollY>500), {passive:true});
totop.onclick = ()=>window.scrollTo({top:0,behavior:'smooth'});

window.addEventListener('hashchange', route);
route();
</script>
